trigger:
  branches:
    include:
      - standalone
      - standalone_prod

pool:
  vmImage: "ubuntu-latest"

variables:
  # standalone -> dev (groupe sfeauto-dev), standalone_prod -> prod (groupe sfeauto-prod)
  - ${{ if eq(variables['Build.SourceBranchName'], 'standalone_prod') }}:
    - group: sfeauto-prod
    - name: webAppName
      value: "app-sfeauto-api-prod"
  - ${{ else }}:
    - group: sfeauto-dev
    - name: webAppName
      value: "app-sfeauto-api-dev"

  - name: nodeVersion
    value: "20.x"

  - name: azureServiceConnection
    value: "sc-sfeauto-azure"

  - name: packageDir
    value: "$(Build.ArtifactStagingDirectory)/package"

  - name: packagePath
    value: "$(Build.ArtifactStagingDirectory)/app.zip"

steps:
  - task: UseNode@1
    displayName: "Use Node.js $(nodeVersion)"
    inputs:
      version: "$(nodeVersion)"

  - script: |
      node -v
      npm -v
    displayName: "Check Node and npm versions"

  - script: |
      npm ci
      npx prisma generate # <-- Ajout crucial ici
      npm run build
    displayName: "Install, Generate Prisma and Build"
    env:
      DATABASE_URL: $(DATABASE_URL)
      NEXTAUTH_URL: $(NEXTAUTH_URL)
      NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
      AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
      AZURE_BLOB_CONTAINER: $(AZURE_BLOB_CONTAINER)
      RAPIDAPI_KEY: $(RAPIDAPI_KEY)
      RAPIDAPI_URL: $(RAPIDAPI_URL)
      RAPIDAPI_HOST: $(RAPIDAPI_HOST)
      NEXT_PUBLIC_API_URL: $(NEXT_PUBLIC_API_URL)
      AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
      AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
      AZURE_OPENAI_MODEL: $(AZURE_OPENAI_MODEL)
      EMAIL_HOST: $(EMAIL_HOST)
      EMAIL_PORT: $(EMAIL_PORT)
      EMAIL_USER: $(EMAIL_USER)
      EMAIL_PASS: $(EMAIL_PASS)
      EMAIL_FROM: $(EMAIL_FROM)
      EMAIL_NOTIFY_TO: $(EMAIL_NOTIFY_TO)


  - script: |
      rm -rf "$(packageDir)"
      mkdir -p "$(packageDir)"

      rsync -a .next/standalone/ "$(packageDir)/"

      mkdir -p "$(packageDir)/.next"
      cp -R .next/static "$(packageDir)/.next/"

      if [ -f .next/BUILD_ID ]; then
        cp .next/BUILD_ID "$(packageDir)/.next/BUILD_ID"
      fi

      if [ -d public ]; then
        cp -R public "$(packageDir)/"
      fi

      if [ -d prisma ]; then
        cp -R prisma "$(packageDir)/"
      fi

      if [ -d node_modules/.prisma ]; then
        mkdir -p "$(packageDir)/node_modules"
        cp -R node_modules/.prisma "$(packageDir)/node_modules/.prisma"
      fi

      # server.js custom (Socket.io) : le build standalone genere son propre
      # server.js minimal sans Socket.io, on le remplace par le notre.
      cp server.js "$(packageDir)/server.js"

      # socket.io n'est jamais trace par le bundler standalone (import type
      # uniquement dans le code applicatif), on l'installe donc a part.
      (cd "$(packageDir)" && npm install socket.io@^4.8.3 --no-save --omit=dev)

      echo "=== package content ==="
      find "$(packageDir)" -maxdepth 3 | sort
    displayName: "Prepare standalone package"

  - task: ArchiveFiles@2
    displayName: "Archive standalone package"
    inputs:
      rootFolderOrFile: "$(packageDir)"
      includeRootFolder: false
      archiveType: "zip"
      archiveFile: "$(packagePath)"
      replaceExistingArchive: true

  - task: AzureWebApp@1
    displayName: "Deploy to Azure"
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      appType: "webAppLinux"
      appName: "$(webAppName)"
      package: "$(packagePath)"
      deploymentMethod: "zipDeploy"

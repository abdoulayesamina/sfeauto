trigger:
  branches:
    include:
      - develop

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: sfeauto-dev

  - name: nodeVersion
    value: "20.x"

  - name: azureServiceConnection
    value: "sc-sfeauto-azure"

  - name: webAppName
    value: "app-sfeauto-api-dev"

  - name: packagePath
    value: "$(Build.ArtifactStagingDirectory)/app.zip"

steps:
  - task: NodeTool@0
    displayName: "Use Node.js $(nodeVersion)"
    inputs:
      versionSpec: "$(nodeVersion)"

  - script: |
      node -v
      npm -v
    displayName: "Check Node and npm versions"

  - script: |
      npm ci
    displayName: "Install dependencies"

  - script: |
      npm run build
    displayName: "Build application"
    env:
      DATABASE_URL: $(DATABASE_URL)
      NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
      NEXTAUTH_URL: $(NEXTAUTH_URL)
      AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
      AZURE_BLOB_CONTAINER: $(AZURE_BLOB_CONTAINER)
      RAPIDAPI_KEY: $(RAPIDAPI_KEY)
      RAPIDAPI_URL: $(RAPIDAPI_URL)
      RAPIDAPI_HOST: $(RAPIDAPI_HOST)
      NEXT_PUBLIC_API_URL: $(NEXT_PUBLIC_API_URL)

  - task: ArchiveFiles@2
    displayName: "Archive application files"
    inputs:
      rootFolderOrFile: "$(System.DefaultWorkingDirectory)"
      includeRootFolder: false
      archiveType: "zip"
      archiveFile: "$(packagePath)"
      replaceExistingArchive: true

  - task: AzureWebApp@1
    displayName: "Deploy to Azure App Service DEV"
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      appType: "webAppLinux"
      appName: "$(webAppName)"
      package: "$(packagePath)"
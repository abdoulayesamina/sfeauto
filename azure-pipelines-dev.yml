trigger:
  branches:
    include:
      - standalone

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: sfeauto-dev

  - name: nodeVersion
    value: "20.x"

  - name: azureServiceConnection
    value: "sc-sfeauto-azure"

  - name: webAppName
    value: "app-sfeauto-api-dev"

  - name: packageDir
    value: "$(Build.ArtifactStagingDirectory)/package"

  - name: packagePath
    value: "$(Build.ArtifactStagingDirectory)/app.zip"

steps:
  - task: UseNode@1
    displayName: "Use Node.js $(nodeVersion)"
    inputs:
      version: "$(nodeVersion)"

  - script: |
      node -v
      npm -v
    displayName: "Check Node and npm versions"

  - script: |
      npm ci
      npx prisma generate # <-- Ajout crucial ici
      npm run build
    displayName: "Install, Generate Prisma and Build"
    env:
      DATABASE_URL: $(DATABASE_URL)
      NEXTAUTH_URL: $(NEXTAUTH_URL)
      NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
      AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
      AZURE_BLOB_CONTAINER: $(AZURE_BLOB_CONTAINER)
      RAPIDAPI_KEY: $(RAPIDAPI_KEY)
      RAPIDAPI_URL: $(RAPIDAPI_URL)
      RAPIDAPI_HOST: $(RAPIDAPI_HOST)
      NEXT_PUBLIC_API_URL: $(NEXT_PUBLIC_API_URL)


  - script: |
      rm -rf "$(packageDir)"
      mkdir -p "$(packageDir)"

      rsync -a .next/standalone/ "$(packageDir)/"

      mkdir -p "$(packageDir)/.next"
      cp -R .next/static "$(packageDir)/.next/"

      if [ -f .next/BUILD_ID ]; then
        cp .next/BUILD_ID "$(packageDir)/.next/BUILD_ID"
      fi

      if [ -d public ]; then
        cp -R public "$(packageDir)/"
      fi

      if [ -d prisma ]; then
        cp -R prisma "$(packageDir)/"
      fi

      if [ -d node_modules/.prisma ]; then
        mkdir -p "$(packageDir)/node_modules"
        cp -R node_modules/.prisma "$(packageDir)/node_modules/.prisma"
      fi

      echo "=== package content ==="
      find "$(packageDir)" -maxdepth 3 | sort
    displayName: "Prepare standalone package"

  - task: ArchiveFiles@2
    displayName: "Archive standalone package"
    inputs:
      rootFolderOrFile: "$(packageDir)"
      includeRootFolder: false
      archiveType: "zip"
      archiveFile: "$(packagePath)"
      replaceExistingArchive: true

  - task: AzureWebApp@1
    displayName: "Deploy to Azure"
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      appType: "webAppLinux"
      appName: "$(webAppName)"
      package: "$(packagePath)"
      deploymentMethod: "zipDeploy"
